name: Build Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Install dependencies
      run: npm install

    - name: Prepare web assets
      run: |
        mkdir -p www
        cp index.html www/
        cp -r css www/
        cp -r js www/

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets
      run: npx cap sync

    # --- ГЕНЕРИРУЕМ КЛЮЧ И ПОДПИСЫВАЕМ ---
    - name: Generate Keystore
      run: |
        cd android/app
        keytool -genkeypair -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=MyApp, OU=MyUnit, O=MyOrg, L=MyCity, S=MyState, C=US"

    - name: Build Signed Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/app/my-release-key.keystore \
          -Pandroid.injected.signing.store.password=password123 \
          -Pandroid.injecting.signing.key.alias=my-key-alias \
          -Pandroid.injected.signing.key.password=password123

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Tehnobaraholka-Signed
        path: android/app/build/outputs/apk/release/app-release.apk
